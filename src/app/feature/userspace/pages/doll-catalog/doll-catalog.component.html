<div class="catalog-container min-h-screen bg-slate-50">
  @if (ui.isFilterOpen()) {
    <div class="filters-drawer-animation" @dropdown>
      <app-filter-panel></app-filter-panel>
    </div>
  }

  <main class="catalog-content w-full" [class.is-loading]="service.isLoading()">
    @if (service.isLoading() && service.dolls().length === 0) {
      <div class="initial-spinner">
        <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
      </div>
    }

    <div class="doll-grid">
      @for (doll of service.dolls(); track doll.id) {
        <app-doll-card [doll]="doll"></app-doll-card>
      } @empty {
        @if (!service.isLoading()) {
          <div class="empty-state">
            <mat-icon>search</mat-icon>
            <p>No dolls found matching these filters.</p>
          </div>
        }
      }

      @if (service.hasMore()) {
        <div #infiniteTrigger class="infinite-scroll-trigger">
          @if (service.isLoading()) {
            <mat-progress-spinner
              mode="indeterminate"
              diameter="40"
            ></mat-progress-spinner>
          }
        </div>
      }
    </div>
  </main>
</div>
