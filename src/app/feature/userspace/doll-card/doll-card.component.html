<mat-card class="doll-card" (click)="onCardClick()">

  <div class="image-container">
    <img [src]="doll.photos?.[0]?.imageUrl" [alt]="doll.name">
    <div class="body-badge">{{ doll.bodyVolume }}</div>
  </div>

  <mat-card-content class="info-content">
    <div class="brand-label">{{ doll.brand }}</div>
    <h3 class="doll-name">{{ doll.name || 'No Name' }}</h3>
    <p class="original-name">{{ doll.originalName }}</p>

    <div class="tags-container">
      <span class="tag">{{ doll.mold }}</span>
      <span class="tag">{{ doll.footType }}</span>
    </div>
  </mat-card-content>

  <div class="card-footer">
    <span>#{{ doll.itemNumber }}</span>
    <span [class.status-active]="doll.status === 'active'">
      ● {{ doll.status }}
    </span>
  </div>

</mat-card>
