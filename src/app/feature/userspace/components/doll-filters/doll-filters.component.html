<form
  [formGroup]="filterForm"
  class="w-full flex justify-center items-center flex-col pt-4 px-2 md:px-0"
>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4 items-end">
    @for (item of filterConfigs; track item.ctrl) {
      @if (item.alwaysShow || isUserspace()) {
        <app-doll-select
          [label]="item.label"
          [formControlName]="item.ctrl"
          [options]="item.options"
          [isSort]="item.isSort || false"
          [isUserspace]="isUserspace()"
          (changed)="onFilterChange()"
        ></app-doll-select>
      }
    }

    @if (isUserspace()) {
      <div class="flex items-center gap-4 h-11 pl-2">
        <mat-checkbox
          formControlName="hasCouple"
          (change)="onFilterChange()"
          color="primary"
        >
          <span class="text-sm font-medium text-slate-700">Couple</span>
        </mat-checkbox>
        <mat-checkbox
          formControlName="hybrid"
          (change)="onFilterChange()"
          color="primary"
        >
          <span class="text-sm font-medium text-slate-700">Hybrid</span>
        </mat-checkbox>
      </div>
    }
  </div>

  <div class="mt-[1.5rem] flex justify-center w-full">
    <button
      type="button"
      (click)="resetFilters()"
      [disabled]="filterForm.pristine || dollService.isLoading()"
      class="w-full sm:w-64 h-12 flex items-center justify-center gap-2 rounded-2xl border-2 border-fuchsia-glam text-fuchsia-glam font-bold hover:bg-red-50 transition-all active:scale-95 disabled:opacity-30 disabled:cursor-not-allowed"
    >
      <mat-icon class="text-xl">restart_alt</mat-icon>
      Reset Filters
    </button>
  </div>
</form>
